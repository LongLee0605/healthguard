<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthGuard — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #f8fafc;
      padding: 2rem;
      text-align: center;
    }
    .card {
      max-width: 24rem;
      padding: 2rem;
      border-radius: 1rem;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 14px; display: block; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #14b8a6; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #0f766e;
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { background: #14b8a6; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icon.svg" alt="HealthGuard" width="64" height="64" />
    <h1>Không có kết nối mạng</h1>
    <p>HealthGuard cần internet để đồng bộ dữ liệu sức khỏe. Vui lòng kiểm tra kết nối và thử lại.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
